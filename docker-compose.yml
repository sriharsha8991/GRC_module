version: "3.9"

services:

  # ── Qdrant — Vector Database ─────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis — Query Cache ──────────────────────────────
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "1024mb",
        "--maxmemory-policy",
        "allkeys-lfu"
      ]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── GRC API — Core RAG / ingestion service ───────────
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # # ── API Gateway — External entrypoint ────────────────
