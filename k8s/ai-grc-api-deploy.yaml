apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-grc-api
  namespace: ai-components
  labels:
    app.kubernetes.io/name: ai-grc-api
    app.kubernetes.io/part-of: grc
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-grc-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-grc-api
        app.kubernetes.io/part-of: grc
        app.kubernetes.io/component: backend
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-qdrant
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z qdrant 6333; do
                echo "waiting for external qdrant..."
                sleep 2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: wait-for-redis
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "waiting for redis..."
                sleep 2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: ai-grc-api
          image: harbor.local:8443/uat-images/ai-grc-api:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ai-grc-api-config
            - secretRef:
                name: ai-grc-api-secret
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
         
          volumeMounts:
            - name: api-tmp
              mountPath: /tmp
            - name: api-data
              mountPath: /app/data
            - name: tmp
              mountPath: /cache
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: api-tmp
          emptyDir: {}
        - name: api-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: ai-grc-api-svc
  namespace: ai-components
  labels:
    app.kubernetes.io/name: ai-grc-api
    app.kubernetes.io/part-of: grc
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ai-grc-api
  ports:
    - name: http
      port: 1122
      targetPort: http
      nodePort: 31122