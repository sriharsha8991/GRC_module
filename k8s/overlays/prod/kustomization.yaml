apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grc-prod

resources:
  - ../../base
  - namespace.yaml

secretGenerator:
  - name: grc-secrets
    envs:
      - secrets.env

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: patches/replicas.yaml
  - path: patches/resources.yaml
