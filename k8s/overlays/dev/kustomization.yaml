apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grc-dev

resources:
  - ../../base
  - namespace.yaml

images:
  - name: REGISTRY_PLACEHOLDER/grc-api
    newName: grc-api
    newTag: dev
  - name: REGISTRY_PLACEHOLDER/grc-gateway
    newName: grc-gateway
    newTag: dev

secretGenerator:
  - name: grc-secrets
    envs:
      - secrets.env

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: patches/resources.yaml
