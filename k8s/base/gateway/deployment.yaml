apiVersion: apps/v1
kind: Deployment
metadata:
  name: grc-gateway
  labels:
    app.kubernetes.io/name: grc-gateway
    app.kubernetes.io/part-of: grc
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grc-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grc-gateway
        app.kubernetes.io/part-of: grc
        app.kubernetes.io/component: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-api
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z grc-api 8095; do
                echo "waiting for grc-api..."
                sleep 2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      containers:
        - name: gateway
          image: REGISTRY_PLACEHOLDER/grc-gateway:IMAGE_TAG
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: grc-gateway-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: gateway-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: gateway-tmp
          emptyDir: {}
