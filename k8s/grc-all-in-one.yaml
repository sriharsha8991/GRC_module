# =============================================================================
# GRC Module — Single Kubernetes Manifest
# Qdrant runs EXTERNALLY as a Docker container (see docker-compose.qdrant.yml).
# This manifest creates an Endpoints + Service so in-cluster pods can reach it
# via the DNS name "qdrant" just like before.
#
# BEFORE APPLYING: set QDRANT_HOST_IP to the IP address of the machine running
# the Qdrant Docker container (e.g. your host / node IP).
#   kubectl apply -f grc-all-in-one.yaml
# =============================================================================

# ─── Namespace (optional — remove if using default) ─────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: grc
  labels:
    app.kubernetes.io/part-of: grc

---
# =============================================================================
# EXTERNAL QDRANT — Endpoints + headless Service
# Replace <QDRANT_HOST_IP> with the actual IP of your Docker host.
# Do NOT use 127.0.0.1 — use the LAN / bridge IP reachable from the cluster.
# Example: 192.168.1.50 or host.docker.internal IP.
# =============================================================================
apiVersion: v1
kind: Endpoints
metadata:
  name: qdrant
  namespace: grc
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: grc
    app.kubernetes.io/component: database
subsets:
  - addresses:
      - ip: "192.168.1.12"        # ← CHANGE THIS to your host IP
    ports:
      - name: http
        port: 6333
        protocol: TCP
      - name: grpc
        port: 6334
        protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: grc
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: grc
    app.kubernetes.io/component: database
spec:
  # No selector — routes to the manually defined Endpoints above
  type: ClusterIP
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334

---
# =============================================================================
# REDIS — Deployment + Service (runs inside the cluster)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: grc
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: grc
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: grc
        app.kubernetes.io/component: cache
    spec:
      nodeSelector:
        workload: grc
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - redis-server
            - --maxmemory
            - 1024mb
            - --maxmemory-policy
            - allkeys-lfu
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 1
            periodSeconds: 300
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 500
          volumeMounts:
            - name: redis-tmp
              mountPath: /tmp
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: redis-tmp
          emptyDir: {}
        - name: redis-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: grc
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: grc
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

---
# =============================================================================
# GRC API — ConfigMap + Deployment + Service
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grc-api-config
  namespace: grc
  labels:
    app.kubernetes.io/name: grc-api
    app.kubernetes.io/part-of: grc
    app.kubernetes.io/component: backend
data:
  # ── Qdrant (points to the external Docker container via headless Service) ──
  GRC_QDRANT__URL: "http://qdrant:6333"
  GRC_QDRANT__COLLECTION_NAME: "grc_controls"
  GRC_QDRANT__DISTANCE: "Cosine"
  # ── Gemini ──────────────────────────────────────────
  GRC_GEMINI__PARSE_MODEL: "gemini-2.5-flash"
  GRC_GEMINI__EMBEDDING_MODEL: "gemini-embedding-001"
  GRC_GEMINI__WINDOW_SIZE: "30000"
  # ── Embedding ──────────────────────────────────────
  GRC_EMBEDDING__DIMENSION: "1536"
  GRC_EMBEDDING__BATCH_SIZE: "32"
  GRC_EMBEDDING__TEI_URL: "http://localhost:8081"
  # ── Chunking ───────────────────────────────────────
  GRC_CHUNKING__SIZE: "256"
  GRC_CHUNKING__OVERLAP: "50"
  # ── Storage ────────────────────────────────────────
  GRC_STORAGE__BACKEND: "local"
  GRC_STORAGE__LOCAL_PDF_DIR: "data/pdfs"
  GRC_STORAGE__DELETE_PDF_AFTER_INGESTION: "true"
  # ── Retrieval ──────────────────────────────────────
  GRC_RETRIEVAL__LIMIT: "10"
  GRC_RETRIEVAL__CRITIC_CONFIDENCE_THRESHOLD: "70"
  # ── Redis ──────────────────────────────────────────
  GRC_REDIS__URL: "redis://redis:6379"
  GRC_REDIS__ENABLED: "true"
  GRC_REDIS__SOCKET_TIMEOUT: "1.0"
  GRC_REDIS__MAX_MEMORY_MB: "1024"
  GRC_REDIS__EVICTION_TRIGGER_PCT: "80"
  GRC_REDIS__EVICTION_TARGET_PCT: "30"
  GRC_REDIS__LOCK_TIMEOUT: "30"
  GRC_REDIS__KEY_PREFIX: "grc"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grc-api
  namespace: grc
  labels:
    app.kubernetes.io/name: grc-api
    app.kubernetes.io/part-of: grc
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grc-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grc-api
        app.kubernetes.io/part-of: grc
        app.kubernetes.io/component: backend
    spec:
      nodeSelector:
        workload: grc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-qdrant
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z qdrant 6333; do
                echo "waiting for external qdrant..."
                sleep 2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
        - name: wait-for-redis
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "waiting for redis..."
                sleep 2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      containers:
        - name: api
          image: grc-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: grc-api-config
            - secretRef:
                name: grc-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 500
         
          volumeMounts:
            - name: api-tmp
              mountPath: /tmp
            - name: api-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: api-tmp
          emptyDir: {}
        - name: api-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: grc-api
  namespace: grc
  labels:
    app.kubernetes.io/name: grc-api
    app.kubernetes.io/part-of: grc
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grc-api
  ports:
    - name: http
      port: 1122
      targetPort: http


